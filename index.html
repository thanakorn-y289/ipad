<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9a2f3f">
  <title>ระบบยืม-คืน iPad · โรงเรียนปากช่อง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <!-- ปุ่มเข้าสู่ระบบด้วย Google — skill pcschool-google-login (โค้ดชุดเดียวกับ /ask /doc /senddoc) -->
  <script src="https://accounts.google.com/gsi/client" async onload="window.gReady && window.gReady()"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #fcf4f6; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    /* หน้าโหลด % (ชุดเดียวกับ Styles.html ของแอป) */
    .bootld{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;box-sizing:border-box;
      background:radial-gradient(circle at 18% 12%,#f5e3e7 0,transparent 42%),radial-gradient(circle at 85% 92%,#fbf6ec 0,transparent 45%),linear-gradient(180deg,#fcf4f6,#fff 55%,#f5f7fa);transition:opacity .35s,visibility .35s}
    .bootld.off{opacity:0;visibility:hidden;pointer-events:none}
    .bl-card{width:min(400px,100%);box-sizing:border-box;background:rgba(255,255,255,.94);border:1px solid #f5e3e7;border-radius:24px;box-shadow:0 24px 60px -24px rgba(92,24,35,.32);padding:28px 26px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .bl-ring{position:relative;width:116px;height:116px;display:grid;place-items:center;margin-bottom:14px}
    .bl-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .bl-track{fill:none;stroke:#f5e3e7;stroke-width:5}
    .bl-arc{fill:none;stroke:url(#blg);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .2s linear}
    .bl-logo{display:block;width:54px;height:72px;margin:0;object-fit:contain;background-size:contain}
    .bl-title{font-size:20px;font-weight:700;color:#5c1823}
    .bl-msg{display:block;margin-top:4px;min-height:21px;font-size:14px;color:#6b7684}
    .bl-row{display:flex;align-items:center;gap:14px;width:100%;margin-top:20px}
    .bl-bar{flex:1;height:12px;border-radius:99px;background:#f5e3e7;overflow:hidden}
    .bl-bar i{display:block;width:0;height:100%;border-radius:inherit;transition:width .2s linear;animation:blst .8s linear infinite;
      background:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 8px,transparent 8px 16px),linear-gradient(90deg,#7b2230,#9a2f3f 45%,#c9a35a);background-size:22.63px 22.63px,100% 100%}
    @keyframes blst{to{background-position:22.63px 0,0 0}}
    .bl-pct{min-width:50px;text-align:right;font-size:20px;font-weight:700;color:#7b2230;font-variant-numeric:tabular-nums}
    @media(prefers-reduced-motion:reduce){.bl-bar i{animation:none}}
    #bootld { font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    /* ปุ่ม Google วางทับช่อง #gSlot ในการ์ดเข้าสู่ระบบของแอปตามพิกัดที่แอปส่งมา
       ปุ่มต้องอยู่หน้านี้ เพราะ Google รับปุ่มเฉพาะโดเมนที่ลงทะเบียน (กรอบ Apps Script ลงทะเบียนไม่ได้) */
    #gfloat { display: none; position: fixed; z-index: 5; align-items: center; justify-content: center; background: #fff; border-radius: 999px; }
    #gfloat.on { display: flex; }
    /* ปุ่มสำรองเมื่อปุ่ม Google ไม่ขึ้น (เบราว์เซอร์ในแอป LINE/Facebook) */
    #gfb { width: 100%; height: 40px; border: 1px solid #dadce0; border-radius: 999px; background: #fff; color: #3c4043;
      font: 500 14px/1 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    #gfb .gfb-g { font-weight: 700; color: #4285f4; font-size: 16px; }
  </style>
</head>
<body>
  <div id="bootld" class="bootld" role="progressbar" aria-label="กำลังโหลด" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bl-card"><div class="bl-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="blg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a2f3f"/><stop offset="1" stop-color="#c9a35a"/></linearGradient></defs><circle class="bl-track" cx="60" cy="60" r="54"/><circle class="bl-arc" cx="60" cy="60" r="54" pathLength="100"/></svg><img class="bl-logo" src="logo.png" alt="ตราโรงเรียน"></div><b class="bl-title">ระบบยืม-คืน iPad</b><small class="bl-msg">กำลังเชื่อมต่อ…</small><div class="bl-row"><div class="bl-bar"><i></i></div><b class="bl-pct">0%</b></div></div></div>
  <!-- ลิงก์ Web app (Deploy → Manage deployments → Web app URL) — เปลี่ยนเมื่อสร้าง deployment ใหม่ (ปกติใช้ Edit → New version จึงไม่ต้องเปลี่ยน) -->
  <iframe id="app" title="ระบบยืม-คืน iPad" allow="camera; clipboard-write"
          src="https://script.google.com/a/macros/pcschool.ac.th/s/AKfycbycDb1lJ7wUZjFbJ5ApGtNhmDnX0OdoL7Ptq2B8VR6bj8bd08nu-LPvvsuFD2lLcMlk/exec"></iframe>
  <div id="gfloat" role="region" aria-label="เข้าสู่ระบบด้วย Google"><div id="gbtn"></div><button type="button" id="gfb" style="display:none"></button></div>
  <script>
    var link = document.getElementById('app');
    // ลิงก์รีเซ็ตรหัสผ่านจากอีเมล (?reset=...) ส่งต่อให้แอป
    (function () {
      var q = location.search.match(/[?&]reset=([a-f0-9]{64})/);
      if (q) link.src = link.src + '?reset=' + q[1];
    })();
    /* หน้าโหลด % — วิ่งเองถึง ~92% แล้วรอสัญญาณพร้อม (BL.done) จึงเต็ม 100% แล้วจางหาย */
    var BL = (function () {
      var el = document.getElementById('bootld'), p = 0, fin = false, tm = 0;
      var MSG = [[0, 'กำลังเชื่อมต่อ…'], [25, 'กำลังเปิดระบบ…'], [55, 'กำลังเข้าสู่ระบบ…'], [80, 'กำลังโหลดข้อมูล…'], [100, 'พร้อมแล้ว']];
      function q(s) { return el.querySelector(s); }
      function draw() {
        var v = Math.floor(p), m = '';
        for (var i = 0; i < MSG.length; i++) if (v >= MSG[i][0]) m = MSG[i][1];
        q('.bl-bar i').style.width = p + '%'; q('.bl-arc').style.strokeDasharray = p + ' 100';
        q('.bl-pct').textContent = v + '%'; q('.bl-msg').textContent = m; el.setAttribute('aria-valuenow', v);
      }
      function tick() {
        p += fin ? Math.max(5, (100 - p) * .4) : (92 - p) * .035;
        if (p >= 100) { p = 100; draw(); clearInterval(tm); tm = 0; setTimeout(function () { el.classList.add('off'); }, 250); return; }
        draw();
      }
      return {
        start: function () { fin = false; p = 0; el.classList.remove('off'); clearInterval(tm); tm = setInterval(tick, 100); draw(); },
        set: function (v) { if (v > p && !fin) { p = v; draw(); } },
        done: function () { fin = true; }
      };
    })();
    BL.start();
    // กรอบโหลดเสร็จ = ~80% · แอปส่ง tes:'auth' (หน้าเข้าสู่ระบบ/เข้าแล้ว) = 100% · กันค้าง: 8 วิหลังกรอบโหลด / 20 วิรวม
    link.addEventListener('load', function () { BL.set(80); setTimeout(BL.done, 8000); });
    setTimeout(BL.done, 20000);

    /*
     * ปุ่มเข้าสู่ระบบด้วย Google — คู่กับ GSSO ใน App.html และ googleLogin_ ใน Code.gs
     *   แอป → หน้านี้ { tes:'auth', state:'login'|'in'|'logout' } / { tes:'gslot', rect } (ช่องในการ์ด, null = ซ่อน)
     *   หน้านี้ → แอป { tes:'gwrap' } (มีปุ่มจริง แอปจึงเว้นช่อง) / { tes:'gcred', credential, selectBy } (ผลจาก Google)
     * ส่ง credential กลับไปที่หน้าต่างที่ส่งข้อความมาเท่านั้น (ev.source + ev.origin ของกรอบ Apps Script)
     */
    // Client ID ของ Google — ใช้ GitHub/Client ID ของตัวเอง: เปลี่ยนบรรทัดนี้ และตั้ง GOOGLE_CLIENT_ID ใน Script Properties ให้ตรงกัน
    var GOOGLE_CLIENT_ID = '258938261280-kb26o3gnnqkt434pm2m67toako5jgvu8.apps.googleusercontent.com';
    var gApp = null, gOrigin = '', gInit = false, gWant = false, gNoAuto = false, gPrompted = false;
    var gRect = null, gBtnW = 0;
    var gFloat = document.getElementById('gfloat');

    function gReadyNow() { return !!(window.google && google.accounts && google.accounts.id); }
    function gInitOnce() {
      if (gInit || !gReadyNow()) return gInit;
      gInit = true;
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: gCallback, auto_select: true,
        hd: 'pcschool.ac.th', context: 'signin', ux_mode: 'popup', use_fedcm_for_prompt: true, cancel_on_tap_outside: false });
      return true;
    }

    // เบราว์เซอร์ในแอป (LINE/Facebook/Instagram) Google ไม่วาดปุ่ม → ปุ่ม "เปิดในเบราว์เซอร์"
    var gInApp = /\bLine\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent);
    // เด้งออกไปเบราว์เซอร์จริงอัตโนมัติ: LINE → openExternalBrowser=1 · Facebook/Instagram บน Android → Chrome
    // (iPhone ใน Facebook/Instagram บังคับออกไม่ได้ → ยังมีปุ่ม "เปิดในเบราว์เซอร์")
    (function () {
      var ua = navigator.userAgent;
      if (/\bLine\//i.test(ua) && !/[?&]openExternalBrowser=1/.test(location.search)) {
        var u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1'); location.replace(u.toString());
      } else if (/Android/i.test(ua) && /FBAN|FBAV|Instagram/i.test(ua)) {
        location.href = 'intent://' + location.host + location.pathname + location.search + location.hash + '#Intent;scheme=https;package=com.android.chrome;end';
      }
    })();
    var gFbTimer = 0;
    function gFallback(kind) {
      var fb = document.getElementById('gfb'), btn = document.getElementById('gbtn');
      if (!kind) { fb.style.display = 'none'; btn.style.display = ''; return; }
      btn.style.display = 'none'; fb.style.display = 'flex';
      if (kind === 'open') {
        fb.innerHTML = '<span class="gfb-g">G</span>เปิดในเบราว์เซอร์เพื่อเข้าด้วย Google';
        fb.onclick = function () { var u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1'); location.href = u.toString(); };
      } else {
        fb.innerHTML = '<span class="gfb-g">G</span>ลงชื่อเข้าใช้ด้วย Google';
        fb.onclick = function () { if (gReadyNow()) google.accounts.id.prompt(); else location.reload(); };
      }
    }

    function gPlace() {
      if (!gWant || !gRect) { gFloat.classList.remove('on'); return; }
      var fr = link.getBoundingClientRect();
      gFloat.style.left = (fr.left + gRect.x) + 'px';
      gFloat.style.top = (fr.top + gRect.y) + 'px';
      gFloat.style.width = gRect.w + 'px';
      gFloat.style.height = gRect.h + 'px';
      gFloat.classList.add('on');
      if (gInApp) { gFallback('open'); return; }
      if (!gInitOnce()) {
        clearTimeout(gFbTimer);
        gFbTimer = setTimeout(function () { if (gWant && !gInitOnce()) gFallback('prompt'); }, 4000);
        return;
      }
      var w = Math.max(200, Math.min(400, Math.floor(gRect.w)));
      if (Math.abs(w - gBtnW) > 4) {
        gBtnW = w;
        gFallback('');
        google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large',
          text: 'signin_with', shape: 'pill', locale: 'th', width: w });
        clearTimeout(gFbTimer);
        gFbTimer = setTimeout(function () {
          if (gWant && !(document.getElementById('gbtn').getBoundingClientRect().height > 10)) gFallback('prompt');
        }, 3000);
      }
      if (!gNoAuto && !gPrompted) { gPrompted = true; google.accounts.id.prompt(); }
    }
    window.gReady = gPlace;
    window.addEventListener('resize', gPlace);

    function gCallback(resp) {
      if (!resp || !resp.credential || !gApp) return;
      gRect = null; gFloat.classList.remove('on');
      gApp.postMessage({ tes: 'gcred', credential: resp.credential, selectBy: String(resp.select_by || '') }, gOrigin);
    }

    window.addEventListener('message', function (ev) {
      var d = ev.data;
      // แอปขอโหลดใหม่ทั้งหน้า (ลากหน้าจอลงในมือถือ)
      if (d && d.tes === 'reload' && /\.googleusercontent\.com$/.test(String(ev.origin))) {
        BL.start();
        location.reload();
        return;
      }
      if (!d || (d.tes !== 'auth' && d.tes !== 'gslot') || !/\.googleusercontent\.com$/.test(String(ev.origin))) return;
      gApp = ev.source; gOrigin = ev.origin;
      if (d.tes === 'auth') BL.done();
      if (d.tes === 'gslot') { gRect = d.rect || null; gPlace(); return; }
      if (d.state === 'login') {
        gWant = true;
        try { gApp.postMessage({ tes: 'gwrap' }, gOrigin); } catch (e) { }
        gPlace();
      } else {
        gWant = false; gRect = null; gPrompted = false; gBtnW = 0;
        gFloat.classList.remove('on');
        try { google.accounts.id.cancel(); } catch (e) { }
        if (d.state === 'logout') { gNoAuto = true; try { google.accounts.id.disableAutoSelect(); } catch (e) { } }
      }
    });
  </script>
</body>
</html>
